<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G2P Codeless Web Builder | Elite Visual Builder</title>
  <style>
    :root { --sidebar: #1e293b; --accent: #00d4ff; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); }
    #sidebar { width: 280px; background: var(--sidebar); color: white; padding: 1rem; overflow-y: auto; }
    #canvas { flex: 1; padding: 2rem; overflow: auto; background: white; min-height: 100%; }
    .component { background: #f1f5f9; border: 1px dashed #94a3b8; margin: 0.75rem 0; padding: 1rem; cursor: move; border-radius: 8px; position: relative; }
    .component:hover { border-color: var(--accent); }
    button { width: 100%; margin: 0.3rem 0; padding: 0.6rem; background: var(--accent); color: #0a1628; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
    h3, h4 { margin-top: 0.5rem; }
    .preview-controls { position: sticky; top: 0; background: white; padding: 0.5rem 0; z-index: 10; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>G2P Codeless Builder</h3>
    <p><small>Visual, semantic, export-ready. Best practices only.</small></p>
    <h4>Components</h4>
    <button onclick="addComponent('hero')">Add Hero</button>
    <button onclick="addComponent('features')">Add Features</button>
    <button onclick="addComponent('card')">Add Card</button>
    <button onclick="addComponent('form')">Add Form</button>
    <button onclick="addComponent('pricing')">Add Pricing</button>
    <button onclick="addComponent('footer')">Add Footer</button>
    <hr style="border-color:#334155; margin:1rem 0;">
    <button onclick="exportHTML()">Export Static HTML</button>
    <button onclick="clearCanvas()">Clear Canvas</button>
    <p style="margin-top:1rem; font-size:0.8rem; color:#94a3b8;">Tip: Edit text directly on canvas. Drag components by selecting them.</p>
  </div>
  <div id="canvas" contenteditable="true">
    <div class="preview-controls">
      <h1 style="margin:0;">Your Elite Site Starts Here</h1>
    </div>
    <p>Add components from the sidebar. Edit freely. Export a clean, deployable static site.</p>
  </div>
  <script>
    function addComponent(type) {
      const div = document.createElement('div');
      div.className = 'component';
      div.setAttribute('contenteditable', 'true');
      switch(type) {
        case 'hero':
          div.innerHTML = '<h1>Hero Headline</h1><p>Compelling subheadline that drives action.</p><button style="width:auto;padding:0.75rem 1.5rem;">Get Started</button>';
          break;
        case 'features':
          div.innerHTML = '<h2>Features</h2><ul><li>Elite performance</li><li>Local-first ops</li><li>AI-assisted structure</li></ul>';
          break;
        case 'card':
          div.innerHTML = '<h3>Service / Product Card</h3><p>Clear description of value.</p>';
          break;
        case 'form':
          div.innerHTML = '<form><input placeholder="Name" style="width:100%;padding:0.5rem;margin:0.25rem 0;"><input placeholder="Email" style="width:100%;padding:0.5rem;margin:0.25rem 0;"><button type="button">Submit</button></form>';
          break;
        case 'pricing':
          div.innerHTML = '<h2>Pricing</h2><div style="display:flex;gap:1rem;"><div><h3>Starter</h3><p>$0</p></div><div><h3>Elite</h3><p>Custom</p></div></div>';
          break;
        case 'footer':
          div.innerHTML = '<footer style="text-align:center;padding:1rem;color:#64748b;">© G2P Technologies · AuraG2P Elite</footer>';
          break;
      }
      document.getElementById('canvas').appendChild(div);
    }

    function exportHTML() {
      const content = document.getElementById('canvas').innerHTML;
      const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exported G2P Site</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 2rem; line-height: 1.6; }
    .component { margin: 1.5rem 0; }
  </style>
</head>
<body>
${content}
</body>
</html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'g2p-elite-site.html';
      a.click();
    }

    function clearCanvas() {
      if (confirm('Clear entire canvas?')) {
        document.getElementById('canvas').innerHTML = '<h1>Canvas Cleared</h1><p>Start building again.</p>';
      }
    }
  </script>
</body>
</html>
